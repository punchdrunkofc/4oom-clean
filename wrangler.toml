name = "4oom-new"
main = "_worker.js"
compatibility_date = "2026-11-04"

[assets]
directory = "."
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "4oom-db"
database_id = "2dbdb197-286d-4e55-a679-14224d5cd58a"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" },
  { name = "BUG_ROOM", class_name = "BugRoom" }
]

# Оставляем старую миграцию для ChatRoom (если он уже был создан)
[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]

# Создаём BugRoom с обязательным SQLite-хранилищем
[[migrations]]
tag = "v2"
new_sqlite_classes = ["BugRoom"]
