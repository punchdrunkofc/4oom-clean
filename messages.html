<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4OOM — Messages</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<video id="bgVideo" autoplay loop muted playsinline preload="auto" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; display: none; filter: sepia(1) hue-rotate(220deg) saturate(3) brightness(0.6);"></video>

<header class="header window">
  <div class="window__bar">
    <span>4OOM — Messenger</span>
    <div class="window__buttons">
      <button class="win-btn" onclick="location.href='/settings.html'">⚙</button>
    </div>
  </div>
  <nav class="nav">
    <a href="/" class="nav__link">← back to home</a>
  </nav>
</header>

<main class="layout layout--single">
  <section class="window" style="height: calc(100vh - 120px); min-height: 480px; display: flex; flex-direction: column;">
    <div class="window__bar"><span>💬 Private Messages</span></div>
    
    <div style="display: flex; flex-grow: 1; overflow: hidden; background: #e0e0e0;">
      <!-- Friends list -->
      <div style="width: 280px; min-width: 200px; border-right: 2px solid #808080; background: #fff; overflow-y: auto; display: flex; flex-direction: column;">
        <div style="background: #a0a0a0; padding: 6px; font-size: 11px; font-weight: bold; border-bottom: 1px solid #808080; flex-shrink: 0;">Friends</div>
        <div id="msgrFriendsList" style="padding: 8px; flex-grow: 1; overflow-y: auto;">
          <div style="color: #888; text-align: center;">Loading...</div>
        </div>
      </div>
      
      <!-- Chat area -->
      <div style="flex-grow: 1; display: flex; flex-direction: column; background: #fff; min-width: 0;">
        <div id="msgrChatHeader" style="background: #a0a0a0; padding: 6px 8px; font-size: 12px; font-weight: bold; border-bottom: 1px solid #808080; flex-shrink: 0; display: flex; align-items: center; gap: 8px;">
          <span id="msgrChatHeaderText">Select a friend to start chatting</span>
          <span id="msgrChatStatus" style="font-size: 11px; font-weight: normal;"></span>
        </div>
        <div id="msgrChatBox" style="flex-grow: 1; overflow-y: auto; padding: 8px; font-family: 'Times New Roman', serif; font-size: 13px;">
          <div style="color: #888; text-align: center; margin-top: 40px;">No chat selected.</div>
        </div>
        
        <div id="msgrEmojiPanel" style="display: none; background: #e0e0e0; padding: 4px; border-top: 1px solid #808080; flex-wrap: wrap; gap: 4px; flex-shrink: 0;">
          <span style="cursor: pointer; font-size: 16px;" onclick="insertEmoji('😀')">😀</span>
          <span style="cursor: pointer; font-size: 16px;" onclick="insertEmoji('😂')">😂</span>
          <span style="cursor: pointer; font-size: 16px;" onclick="insertEmoji('❤️')">❤️</span>
          <span style="cursor: pointer; font-size: 16px;" onclick="insertEmoji('👍')">👍</span>
          <span style="cursor: pointer; font-size: 16px;" onclick="insertEmoji('🔥')">🔥</span>
          <span style="cursor: pointer; font-size: 16px;" onclick="insertEmoji('😎')">😎</span>
          <span style="cursor: pointer; font-size: 16px;" onclick="insertEmoji('💀')">💀</span>
          <span style="cursor: pointer; font-size: 16px;" onclick="insertEmoji('💩')">💩</span>
          <span style="cursor: pointer; font-size: 16px;" onclick="insertEmoji('🎮')">🎮</span>
          <span style="cursor: pointer; font-size: 16px;" onclick="insertEmoji('🎵')">🎵</span>
        </div>

        <div style="padding: 8px; background: #e0e0e0; border-top: 2px solid #808080; flex-shrink: 0;">
          <form id="msgrForm" style="display: flex; gap: 4px;">
            <button type="button" id="msgrEmojiBtn" class="neon-btn" style="margin: 0; padding: 4px 8px;">😀</button>
            <input type="text" id="msgrInput" placeholder="Type a message..." style="flex-grow: 1; padding: 4px; border: 2px solid; border-color: #808080 #fff #fff #808080;" disabled autocomplete="off">
            <button type="submit" class="neon-btn" style="margin: 0;" disabled id="msgrSendBtn">Send</button>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="/script.js"></script>
</body>
</html>
