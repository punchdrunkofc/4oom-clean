<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>4OOM — Messages</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<video id="bgVideo" autoplay loop muted playsinline preload="auto" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; display: none; filter: sepia(1) hue-rotate(220deg) saturate(3) brightness(0.6);"></video>

<header class="header window">
  <div class="window__bar">
    <span>4OOM — Messenger</span>
    <div class="window__buttons">
      <button class="win-btn" onclick="location.href='/settings.html'">⚙</button>
    </div>
  </div>
  <nav class="nav">
    <a href="/" class="nav__link">← back to home</a>
  </nav>
</header>

<main class="layout layout--single">
  <section class="window msgr-page" style="height: calc(100vh - 110px); min-height: 420px; display: flex; flex-direction: column;">
    <div class="window__bar"><span>💬 Private Messages</span></div>
    
    <div class="msgr-shell">
      <!-- Friends list -->
      <div class="msgr-list-pane" id="msgrListPane">
        <div class="msgr-pane-title">Friends</div>
        <div id="msgrFriendsList" class="msgr-friends-scroll">
          <div style="color: #888; text-align: center; padding: 12px;">Loading...</div>
        </div>
      </div>
      
      <!-- Chat area -->
      <div class="msgr-chat-pane" id="msgrChatPane">
        <div id="msgrChatHeader" class="msgr-chat-header">
          <button type="button" id="msgrBackBtn" class="msgr-back-btn" title="Back to list" aria-label="Back">←</button>
          <span id="msgrChatHeaderText">Select a friend to start chatting</span>
          <span id="msgrChatStatus" style="font-size: 12px; font-weight: normal;"></span>
        </div>
        <div id="msgrChatBox" class="msgr-chat-box">
          <div style="color: #888; text-align: center; margin-top: 40px;">No chat selected.</div>
        </div>
        
        <div id="msgrEmojiPanel" style="display: none; background: #e0e0e0; padding: 6px; border-top: 1px solid #808080; flex-wrap: wrap; gap: 6px; flex-shrink: 0;">
          <span style="cursor: pointer; font-size: 20px;" onclick="insertEmoji('😀')">😀</span>
          <span style="cursor: pointer; font-size: 20px;" onclick="insertEmoji('😂')">😂</span>
          <span style="cursor: pointer; font-size: 20px;" onclick="insertEmoji('❤️')">❤️</span>
          <span style="cursor: pointer; font-size: 20px;" onclick="insertEmoji('👍')">👍</span>
          <span style="cursor: pointer; font-size: 20px;" onclick="insertEmoji('🔥')">🔥</span>
          <span style="cursor: pointer; font-size: 20px;" onclick="insertEmoji('😎')">😎</span>
          <span style="cursor: pointer; font-size: 20px;" onclick="insertEmoji('💀')">💀</span>
          <span style="cursor: pointer; font-size: 20px;" onclick="insertEmoji('💩')">💩</span>
          <span style="cursor: pointer; font-size: 20px;" onclick="insertEmoji('🎮')">🎮</span>
          <span style="cursor: pointer; font-size: 20px;" onclick="insertEmoji('🎵')">🎵</span>
        </div>

        <div class="msgr-input-bar">
          <form id="msgrForm" style="display: flex; gap: 6px; width: 100%;">
            <button type="button" id="msgrEmojiBtn" class="neon-btn" style="margin: 0; padding: 8px 10px;">😀</button>
            <input type="text" id="msgrInput" placeholder="Type a message..." style="flex-grow: 1; padding: 10px; border: 2px solid; border-color: #808080 #fff #fff #808080; font-size: 16px;" disabled autocomplete="off">
            <button type="submit" class="neon-btn" style="margin: 0;" disabled id="msgrSendBtn">Send</button>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="/script.js"></script>
</body>
</html>
