 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4OOM — Thread</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Контейнер для видео-фона -->
<video id="bgVideo" autoplay loop muted playsinline preload="auto" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; display: none; filter: sepia(1) hue-rotate(220deg) saturate(3) brightness(0.6);"></video>

<header class="header window">
  <div class="window__bar"><span>4OOM</span><div class="window__buttons"><button class="win-btn" onclick="location.href='/settings.html'">⚙</button></div></div>
  <nav class="nav">
    <a href="/" class="nav__link">← back to threads</a>
  </nav>
</header>

<main class="layout layout--single">
  <section class="window">
    <div class="window__bar"><span>📄 Loading...</span></div>
    <div id="postList"></div>
    
    <div class="window__bar"><span>✍ reply</span></div>
    <form class="reply-form" id="replyForm">
      <textarea class="reply-form__textarea" id="replyBody" placeholder="type something..." rows="4"></textarea>
      
      <label style="font-size: 12px; display: block; margin-bottom: 4px;">Attach Image:</label>
      <input type="file" id="replyImageFile" accept="image/*" class="reply-form__input" style="padding: 2px;">
      
      <label style="font-size: 12px; display: block; margin-bottom: 4px;">Attach Music (mp3):</label>
      <input type="file" id="replyMusicFile" accept="audio/*" class="reply-form__input" style="padding: 2px;">
      
      <div class="reply-form__actions"><button type="submit" class="neon-btn">send</button></div>
    </form>
  </section>
</main>

<footer class="footer"><p>4OOM © 2024</p></footer>
<script src="/script.js"></script>
</body>
</html>
