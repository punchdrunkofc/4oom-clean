<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4OOM — Profile</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="stylesheet" href="/style.css">
<style>
  .banner-container { 
    width: 100%; 
    height: 150px; 
    overflow: hidden; 
    position: relative; 
    border-bottom: 2px solid var(--win-dark); 
    background: #000; 
  }
  .banner { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    object-position: center; 
    display: block; 
  }
  .bio-box { padding: 12px; background: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; margin: 12px; font-family: 'Times New Roman', serif; min-height: 50px; }
</style>
</head>
<body>
<!-- Контейнер для видео-фона -->
<video id="bgVideo" autoplay loop muted playsinline preload="auto" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; display: none; filter: sepia(1) hue-rotate(220deg) saturate(3) brightness(0.6);"></video>

<header class="header window">
  <div class="window__bar"><span>4OOM</span><div class="window__buttons"><button class="win-btn" onclick="location.href='/settings.html'">⚙</button></div></div>
  <nav class="nav">
    <a href="/" class="nav__link">← home</a>
  </nav>
</header>

<main class="layout layout--single">
  <section class="window">
    <div class="window__bar"><span>👤 user_profile</span></div>
    
    <div id="bannerContainer" class="banner-container" style="display:none;">
      <img id="userBanner" class="banner" src="" alt="banner">
    </div>

    <div style="display: flex; align-items: center; padding: 16px; gap: 16px; background: #e0e0e0; border-bottom: 1px solid #808080;">
      <img id="userAvatar" class="avatar" style="width: 100px; height: 100px; border: 2px solid #fff; box-shadow: 1px 1px 0 #000;" src="" alt="avatar">
      
      <div style="flex-grow: 1;">
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <h2 id="userName" style="font-family: 'Impact', sans-serif; font-size: 28px; color: #000080; margin: 0;"></h2>
          <div id="userRole"></div>
        </div>
        <a id="editProfileBtn" href="#" class="neon-btn" style="display: none; margin-top: 8px; padding: 2px 8px; font-size: 11px;">edit profile</a>
      </div>
    </div>

    <div id="userBio" class="bio-box"></div>
  </section>

  <section class="window">
    <div class="window__bar"><span>📁 user's threads</span></div>
    <ul class="thread-list" id="userThreads">
      <li class="thread" style="text-align: left;"><a href="#"><span class="thread__title">Loading...</span></a></li>
    </ul>
  </section>
</main>

<footer class="footer"><p>4OOM © 2024</p></footer>
<script src="/script.js"></script>
</body>
</html>
