<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4OOM — Profile</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="stylesheet" href="/style.css">
<style>
  .banner { width: 100%; height: 150px; background: #808080; object-fit: cover; border-bottom: 2px solid var(--win-dark); display: block; }
  .bio-box { padding: 12px; background: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; margin: 12px; font-family: 'Times New Roman', serif; }
</style>
</head>
<body>
<header class="header window">
  <div class="window__bar"><span>4OOM</span><div class="window__buttons"><button class="win-btn" onclick="location.href='/settings.html'">⚙</button></div></div>
  <nav class="nav">
    <a href="/" class="nav__link">← home</a>
    <a href="/about.html" class="nav__link">about</a>
  </nav>
</header>

<main class="layout layout--single">
  <section class="window">
    <div class="window__bar"><span>👤 user_profile</span></div>
    <img id="userBanner" class="banner" src="" alt="banner" style="display:none;">
    <div style="display: flex; align-items: center; padding: 16px; gap: 16px;">
      <img id="userAvatar" class="avatar" style="width: 100px; height: 100px;" src="" alt="avatar">
      <div>
        <h2 id="userName" style="font-family: 'Impact', sans-serif; font-size: 28px; color: #000080;"></h2>
        <p id="userRole" style="font-size: 14px;"></p>
      </div>
    </div>
    <div id="userBio" class="bio-box"></div>
  </section>

  <section class="window">
    <div class="window__bar"><span>📁 user's threads</span></div>
    <ul class="thread-list" id="userThreads">
      <li class="thread"><a href="#"><span class="thread__title">Loading...</span></a></li>
    </ul>
  </section>
</main>

<footer class="footer"><p>4OOM © 2024</p></footer>
<script src="/script.js"></script>
</body>
</html>
