<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4OOM — Settings</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="header window">
  <div class="window__bar"><span>4OOM</span><div class="window__buttons"><button class="win-btn" onclick="location.href='/'">×</button></div></div>
  <nav class="nav"><a href="/" class="nav__link">← back to home</a></nav>
</header>
<main class="layout layout--single">
  <section class="window">
    <div class="window__bar"><span>🎨 Account Editor</span></div>
    <div class="settings-form">
      <label>Your nickname:</label>
      <input type="text" id="setNick" placeholder="Enter nickname">
      
      <label>Avatar URL:</label>
      <input type="text" id="setAvatar" placeholder="https://example.com/avatar.gif">

      <label>Banner URL (profile header):</label>
      <input type="text" id="setBanner" placeholder="https://example.com/banner.jpg">

      <label>Banner Position (how to crop):</label>
      <select id="setBannerPos" style="width: 100%; margin-bottom: 12px; padding: 4px; border: 2px solid; border-color: #808080 #fff #fff #808080;">
        <option value="center">Center (default)</option>
        <option value="top">Top</option>
        <option value="bottom">Bottom</option>
      </select>

      <label>Bio / Description:</label>
      <textarea id="setBio" placeholder="Tell us about yourself..." style="width: 100%; height: 100px; margin-bottom: 12px; padding: 4px; border: 2px solid; border-color: #808080 #fff #fff #808080;"></textarea>

      <label>Nickname Font:</label>
      <select id="setFont" style="width: 100%; margin-bottom: 8px; padding: 4px; border: 2px solid; border-color: #808080 #fff #fff #808080;">
        <option value="">Default (MS Sans Serif)</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Impact, sans-serif">Impact</option>
        <option value="'Comic Sans MS', cursive, sans-serif">Comic Sans MS</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Lucida Console', monospace">Lucida Console</option>
      </select>

      <div style="padding: 8px; background: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; margin-bottom: 12px; text-align: center;">
        <span style="font-size: 11px; color: #444;">Preview:</span><br>
        <span id="fontPreview" style="font-size: 20px; font-weight: bold; color: #000080;">YourNickname</span>
      </div>

      <button class="neon-btn" onclick="saveSettings()">Save</button>
      <button class="neon-btn" onclick="location.href='/'">Cancel</button>
    </div>
  </section>
</main>
<script src="/script.js"></script>
</body>
</html>
