<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4OOM — Settings</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="stylesheet" href="/style.css">
<!-- Подключаем Cropper.js для обрезки баннера -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<style>
  .preview-container { margin-top: 12px; border: 2px solid var(--win-dark); background: var(--win-bg); }
  .preview-banner { width: 100%; height: 100px; background: #808080; object-fit: cover; display: block; border-bottom: 2px solid var(--win-dark); }
  .preview-bio { padding: 8px; background: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; margin: 8px; font-family: 'Times New Roman', serif; min-height: 40px; font-size: 12px; }
  
  #cropperContainer { width: 100%; height: 300px; background: #000; margin-bottom: 12px; display: none; }
  #cropperImage { max-width: 100%; display: block; }
</style>
</head>
<body>
<header class="header window">
  <div class="window__bar"><span>4OOM</span><div class="window__buttons"><button class="win-btn" onclick="location.href='/'">×</button></div></div>
  <nav class="nav"><a href="/" class="nav__link">← back to home</a></nav>
</header>
<main class="layout layout--single">
  <section class="window">
    <div class="window__bar"><span>🎨 Account Editor</span></div>
    <div class="settings-form">
      <label>Your nickname:</label>
      <input type="text" id="setNick" placeholder="Enter nickname">
      
      <label>Avatar URL:</label>
      <input type="text" id="setAvatar" placeholder="https://example.com/avatar.gif">

      <label>Upload Profile Banner:</label>
      <input type="file" id="bannerFile" accept="image/*" style="margin-bottom: 8px;">
      
      <!-- Контейнер для ручной обрезки баннера -->
      <div id="cropperContainer">
        <img id="cropperImage" src="" alt="Banner to crop">
      </div>
      
      <button type="button" id="saveCropBtn" class="neon-btn" style="display:none; margin-bottom: 12px;" onclick="applyCrop()">Apply Crop</button>
      <input type="hidden" id="setBanner" value="">

      <label>Bio / Description:</label>
      <textarea id="setBio" placeholder="Tell us about yourself..." style="width: 100%; height: 100px; margin-bottom: 12px; padding: 4px; border: 2px solid; border-color: #808080 #fff #fff #808080;"></textarea>

      <label>Nickname Font:</label>
      <select id="setFont" style="width: 100%; margin-bottom: 12px; padding: 4px; border: 2px solid; border-color: #808080 #fff #fff #808080;">
        <option value="">Default (MS Sans Serif)</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Impact, sans-serif">Impact</option>
        <option value="'Comic Sans MS', cursive, sans-serif">Comic Sans MS</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Lucida Console', monospace">Lucida Console</option>
      </select>

      <button class="neon-btn" onclick="saveSettings()">Save</button>
      <button class="neon-btn" onclick="location.href='/'">Cancel</button>
    </div>
  </section>

  <!-- БЛОК ЖИВОГО ПРЕДПРОСМОТРА -->
  <section class="window">
    <div class="window__bar"><span>👤 Live Profile Preview</span></div>
    <div class="preview-container">
      <img id="previewBanner" class="preview-banner" src="" alt="banner" style="display:none;">
      <div style="display: flex; align-items: center; padding: 12px; gap: 12px;">
        <img id="previewAvatar" class="avatar" style="width: 60px; height: 60px;" src="">
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          <span id="previewName" style="font-size: 20px; color: #000080; font-weight: bold;"></span>
          <span id="previewRole"></span>
        </div>
      </div>
      <div id="previewBio" class="preview-bio"></div>
    </div>
  </section>

</main>
<script src="/script.js"></script>
</body>
</html>
